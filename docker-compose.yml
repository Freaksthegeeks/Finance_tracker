services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance_tracker_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: finance_tracker_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
