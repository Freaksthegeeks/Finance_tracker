name: finance_tracker
description: Mobile companion for the Finance Tracker web application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.2
  lucide_icons_flutter: ^4.0.3
  record: ^7.2.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/public_config.json
  fonts:
    - family: TrackerSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
